[project]
name = "escaping-things-data-tools"
version = "0.1.0"
description = "Data synchronization tools for Escaping Things"
requires-python = ">=3.14,<3.15"
dependencies = ["pillow>=12.3.0,<13"]

[dependency-groups]
dev = ["ruff>=0.15.22,<0.16"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
