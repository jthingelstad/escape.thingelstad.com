name: Deploy to S3 and CloudFront

# Tests and builds the site, then publishes it to S3 behind CloudFront (infra/, scripts/deploy-aws.mjs).
# GitHub Pages served the site until the DNS moved to CloudFront on 2026-10-26.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check scripts tests
      - run: uv run --locked ruff format --check scripts tests
      - run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
      - name: Audit locked dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/requirements.txt --disable-pip

  build:
    needs: python-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: an index page's sitemap <lastmod> is its template's
          # last commit (lib/lastmod.js), and a shallow clone has only one.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          retention-days: 7

  # Publishes the tested build: the files that changed, the redirect map into CloudFront's key
  # value store, the cache cleared, then the result read back through the distribution.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: site
          path: _site

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish to S3 and CloudFront
        run: npm run deploy:aws
